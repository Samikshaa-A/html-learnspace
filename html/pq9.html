<!DOCTYPE html>

<body>
    <h1>Registration Form</h1>
    <FORM>
    <input type="text" placeholder="First Name" name="fn">
    <input type="text" placeholder="Last Name" name="ln">
    <br>
    <label for="gender">Please select gender</label>
    <select name="gender" id="gender">
        <option value="male">male</option>
        <option value="female">female</option>
        <option value="other">other</option>
    </select>
    <br>
    <label for="agree">Do you agree to all terms of service?</label>
    <input type="checkbox" id="agree">Yes,I agree
    <br>
    <button>Register</button>
    </FORM>
</body>
