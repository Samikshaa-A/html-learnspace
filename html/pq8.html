<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>search option that redirects its search request to google</title>
</head>
<body>
    <form action="http://www.google.com/search">
        <input type="text" placeholder="search in google" name="q">
        <button>search</button>
    </form>
    <hr>
    <form action="https://www.youtube.com/results?search_query">
        <input type="text" placeholder="search in youtube" name="search_query">
        <button>search</button>
    </form>
    <hr>
    <form action="https://www.reddit.com/search/?q">
        <input type="text" placeholder="search in reddit" name="q">
        <button>search</button>
    </form>
    <hr>
</body>
</html>
